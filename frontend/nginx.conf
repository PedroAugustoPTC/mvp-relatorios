server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy da API para o backend dentro da rede do docker-compose. Sem isto, chamadas do
    # frontend a /api/v1/** (VITE_API_BASE_URL nao configurado em build-time, default
    # 'http://localhost:8080' = a propria origem do nginx) caem na regra SPA abaixo, que so
    # serve arquivos estaticos: POST/PUT/DELETE para /index.html retornam 405 Not Allowed.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: fallback to index.html so React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
